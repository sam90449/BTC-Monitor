<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Crypto Prediction Monitor
</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(300px,1fr)
);

gap:15px;
}

.card{

background:#1a1a1a;

border:1px solid #333;

border-radius:12px;

padding:15px;

box-shadow:
0 0 10px rgba(
0,255,100,0.15
);

}

.card-title{

font-size:20px;

font-weight:bold;

margin-bottom:10px;
}

.input-row{

display:flex;

gap:5px;

margin-bottom:10px;
}

input{

flex:1;

padding:8px;

font-size:16px;

background:#222;

color:white;

border:1px solid #444;
}

button{

padding:8px 12px;

background:#00aa55;

border:none;

color:white;

cursor:pointer;

font-weight:bold;
}

button:hover{

background:#00cc66;
}

.price{

font-size:22px;

font-weight:bold;

margin-top:10px;
}

.prediction{

margin-top:12px;

font-size:18px;

font-weight:bold;
}

.target{

margin-top:8px;

font-size:16px;
}

.update{

margin-top:8px;

font-size:12px;

color:#aaa;
}

.up{
color:#00ff66;
}

.down{
color:#ff5555;
}

.footer{

margin-top:20px;

text-align:center;

color:#888;
}

</style>

</head>

<body>

<h1>
Crypto Prediction Monitor
</h1>

<div class="grid">

<div id="coin1" class="card"></div>
<div id="coin2" class="card"></div>
<div id="coin3" class="card"></div>
<div id="coin4" class="card"></div>
<div id="coin5" class="card"></div>
<div id="coin6" class="card"></div>

</div>

<div class="footer">

Cloudflare Worker +
GitHub Pages

</div>

<script src="script.js"></script>

</body>

</html>
